[mod-setting-name]
oreguard-tier=OreGuard: Allowed entities on ore patches
oreguard-allow-decorative-tiles=OreGuard: Allow decorative tiles over ore
oreguard-allow-ground-rail=OreGuard: Allow rail tracks, signals and stations over ore
oreguard-modify-ore-collision=OreGuard: Modify ore collision masks
oreguard-verbose-debugging=OreGuard: Verbose debugging

[mod-setting-description]
oreguard-tier=Choose the tier preset deciding which entity families may be placed on ore patches. The active families are listed in the floating warning text when something is blocked; tile paving is governed separately by the decorative-tiles toggle.
oreguard-allow-decorative-tiles=When enabled, tiles (including landfill) may be paved over ore. Blocked tiles are restored to their previous terrain and the tile items are returned to the builder.
oreguard-allow-ground-rail=When enabled, ground rail tracks, rail signals and train stations may be placed over ore: the ore collision layer is no longer applied to rail prototypes at startup (this is a startup setting and takes effect on map load), and the rail planner will no longer be forced onto elevated bridges across ore.
oreguard-modify-ore-collision=Add custom collision layer to ore patches to prevent regular rails from being built on them, while allowing elevated rails to pass over. Skipped for ground-rail prototypes when the ground-rail toggle is enabled. This modification happens during startup and affects all ore entities.
oreguard-verbose-debugging=Enable detailed debug logging for collision mask modifications and entity placement blocking. Warning: This will generate a lot of log output.

[mod-setting-value]
hardcore=Hardcore (only mining drills & pumpjacks)
mining=Belt Mining (drills & pumpjacks, poles, belts, pipes)
bot-mining=Bot Mining (plus roboports, logistic chests)
default=Default (plus containers, beacons, furnaces)

