[mod-name]
oreguard=OreGuard

[mod-description]
oreguard=Prevents building over ore, except for tiered allow-lists (drills & pumpjacks, poles, belts, pipes, etc.) plus toggles for decorative tiles and ground rail over ore. Elevated rails span ore freely.

[mod-setting-name]
oreguard-tier=OreGuard: Ore protection tier
oreguard-allow-decorative-tiles=OreGuard: Allow decorative tiles over ore
oreguard-allow-ground-rail=OreGuard: Allow rail tracks, signals and stations over ore
oreguard-modify-ore-collision=OreGuard: Keep ground rails off ore (collision layer)
oreguard-verbose-debugging=OreGuard: Verbose logging

[mod-setting-description]
oreguard-tier=Pick how much building over ore is allowed. Tiers are cumulative. Hardcore: only drills and pumpjacks. Belt Mining: also power poles, belts (including underground belts and splitters) and pipes (including underground pipes). Bot Mining: also roboports and logistic chests. Default: also containers, beacons and furnaces. Every other entity is refused over ore and its item is returned to the builder; a blocked placement shows a floating warning listing the currently allowed families. Tile paving is governed separately by the decorative-tiles toggle, and ground rail tracks, signals and stations have their own toggle.
oreguard-allow-decorative-tiles=When enabled, tiles (including landfill) may be paved over ore at any tier. Blocked tiles are restored to their previous terrain and the tile items are returned to the builder (player or robot).
oreguard-allow-ground-rail=When enabled, ground rail tracks, rail signals and train stations may be placed over ore: at startup the ore collision layer is no longer applied to regular rail prototypes, the guard allows them, and the rail planner is no longer forced onto elevated bridges across ore. Startup setting - takes effect on map load. (Elevated rails, rail supports and rail ramps are always allowed over ore, regardless of this toggle.)
oreguard-modify-ore-collision=The engine-level half of the rail protection: at startup a dedicated OreGuard collision layer is added to ore, and - unless the rail toggle is enabled - to regular ground-rail prototypes, so the engine itself refuses rails on ore and the rail planner can route elevated bridges where a rail line would cross ore. Elevation-friendly prototypes (elevated rails, rail supports, ramps) are never stamped. With the rail toggle on, only the ore-side layer is stamped, which on its own has no effect.
oreguard-verbose-debugging=Write detailed OreGuard diagnostics to the game log: collision-mask stamping, block decisions, item recovery and the migration sweep. Off by default; expect a lot of output when enabled.

[mod-setting-value]
hardcore=Hardcore - drills & pumpjacks only
mining=Belt Mining - drills & pumpjacks, poles, belts, pipes
bot-mining=Bot Mining - also roboports & logistic chests
default=Default - also containers, beacons & furnaces

